
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFC Jersey Details</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

.container {
    max-width: 430px;
    margin: 45px auto;
    padding: 28px;
    background: #1e293b;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #38bdf8;
    font-size: 27px;
}

.subtitle {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #0f172a;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #0284c7;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0369a1;
}

.message {
    padding: 12px;
    background: #164e63;
    border-radius: 8px;
    margin-bottom: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>HFC JERSEY DETAILS</h1>

<p class="subtitle">Player Registration Form</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST" action="/">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<label>Player Name</label>
<input type="text" name="name"
placeholder="Enter your name" maxlength="80" required>

<label>Jersey Number</label>
<input type="number" name="jersey_no"
placeholder="Enter jersey number" required>

<label>Jersey Size</label>
<select name="jersey_size" required>
<option value="">Select Jersey Size</option>
<option value="XS">XS</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>
</select>

<label>Shorts Size</label>
<select name="shorts_size" required>
<option value="">Select Shorts Size</option>
<option value="XS">XS</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>
</select>

<button type="submit">SUBMIT DETAILS</button>

</form>

</div>

</body>
</html>
