
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFC Jersey Details</title>
<style>
body {
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}
.container {
    max-width: 420px;
    margin: 40px auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
}
h1 { text-align: center; color: #38bdf8; }
input, select, button {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    box-sizing: border-box;
    border-radius: 7px;
}
button {
    background: #0284c7;
    color: white;
    border: none;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="container">
<h1>HFC JERSEY DETAILS</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<p>{{ message }}</p>
{% endfor %}
{% endwith %}

<form method="POST" action="/">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<input name="name" placeholder="Player Name" required>

<input name="jersey_no" type="number" placeholder="Jersey Number" required>

<select name="jersey_size" required>
<option value="">Select Jersey Size</option>
<option>XS</option><option>S</option><option>M</option>
<option>L</option><option>XL</option><option>XXL</option>
</select>

<select name="shorts_size" required>
<option value="">Select Shorts Size</option>
<option>XS</option><option>S</option><option>M</option>
<option>L</option><option>XL</option><option>XXL</option>
</select>

<button type="submit">SUBMIT DETAILS</button>
</form>
</div>
</body>
</html>
